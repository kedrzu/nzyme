name: Check commit
on:
  push:
    branches: [main, release]
jobs:
  check-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install
      - run: bun run setup
      - run: bun run build
      # `bun run test` (not `bun test`) — `test` is a bun builtin; the bare form would ignore the script.
      - run: bun run test
