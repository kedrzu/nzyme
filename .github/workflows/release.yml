name: Release

# Publishes `main` to npm, run by hand. Two jobs:
#
# - **prepare** — when the current version is already tagged, compute the next version and changelog
#   from Conventional Commits since that tag (`nx release`, which reads `git log vX..HEAD`), commit them
#   to main as `chore(release): vX` and push. Nothing releasable since the last tag ends the run.
# - **publish** — build and test that commit, publish every public package to npm, then tag it and
#   create the GitHub Release. When the current version has no tag yet (an earlier run pushed the
#   version and then failed), prepare is skipped and that release commit is published instead.
#   Publishing skips versions already on npm, so a failed run is fixed by re-running it.

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  state:
    name: Resolve release state
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.state.outputs.version }}
      pending: ${{ steps.state.outputs.pending }}
      sha: ${{ steps.state.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - id: state
        run: |
          version=$(jq -r .version packages/utils/package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$(git tag -l "v$version")" ]; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
          else
            # Publish the release commit itself, not whatever landed on top of it since.
            sha=$(git log -1 --format=%H --grep="^chore(release): v$version" || true)
            echo "pending=true" >> "$GITHUB_OUTPUT"
            echo "sha=${sha:-$(git rev-parse HEAD)}" >> "$GITHUB_OUTPUT"
          fi

  prepare:
    name: Bump the version
    needs: state
    if: needs.state.outputs.pending == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.next.outputs.version }}
      sha: ${{ steps.push.outputs.sha }}
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Compute version and changelog
        id: next
        run: |
          current='${{ needs.state.outputs.version }}'
          bun nx release version
          next=$(jq -r .version packages/utils/package.json)
          if [ "$next" = "$current" ]; then
            echo "::notice::No releasable commits (feat/fix/perf/breaking) since v$current."
            exit 0
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          bun nx release changelog "$next"
          # The agent plugins ship from this repo and are versioned with the packages.
          for plugin in plugins/*/.claude-plugin/plugin.json; do
            jq --indent 4 --arg v "$next" '.version = $v' "$plugin" > "$RUNNER_TEMP/plugin.json"
            mv "$RUNNER_TEMP/plugin.json" "$plugin"
          done
          # `nx release version` already refreshed bun.lock; this only normalises formatting.
          bun x oxfmt . > /dev/null

      # A push rejected because main moved meanwhile fails the run before anything is published:
      # run it again.
      - name: Commit and push to main
        id: push
        if: steps.next.outputs.version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "chore(release): v${{ steps.next.outputs.version }}"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish v${{ needs.prepare.outputs.version || needs.state.outputs.version }}
    needs: [state, prepare]
    if: >-
      always() && needs.state.result == 'success'
      && (needs.state.outputs.pending == 'true' || needs.prepare.outputs.sha != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Trusted publishing (OIDC) and npm provenance.
      id-token: write
    env:
      CI: 'true'
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version || needs.state.outputs.version }}
      SHA: ${{ needs.prepare.outputs.sha || needs.state.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # npm >= 11.5.1 is required for trusted publishing.
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - run: npm install -g npm@latest

      - name: Build
        run: bash setup.build.sh

      # The browser build has to match the `playwright` that `@nzyme/vue` installed, so it is installed
      # through that package's own binary rather than a global `playwright`. It comes
      # before the tests: those of `@nzyme/stealth-browser` launch a real Chromium.
      - name: Install Chromium
        working-directory: packages/vue
        run: bun x playwright install --with-deps chromium

      - name: Test
        run: bun run test

      - name: Component tests
        run: bun run test:components

      # Only needed to bootstrap packages that are not on npm yet (trusted publishing can only be
      # configured for an existing package). Without the secret, npm authenticates through OIDC.
      - name: Configure npm token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: env.NPM_TOKEN != ''
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc

      - name: Publish to npm
        run: bun scripts/publish.ts

      - name: Tag and create the GitHub Release
        run: |
          awk -v v="$VERSION" '$0 ~ "^## " v " " {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --target "$SHA" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
