name: Mirror a consumer ref

# Reusable workflow for products that use nzyme as a git submodule (see docs/consumers.md).
#
# A product calls it after its own CI passed on a push to its `main` or `release`. It moves nzyme's
# `<consumer>/<branch>` ref (e.g. `healed/main`) to the nzyme commit that product commit pins — so
# the ref always names an nzyme commit that passed that product's CI, and nzyme knows per product
# what is in its main line and in its production.
#
# The ref only ever fast-forwards. A pin that does not descend from it (the product rolled nzyme
# back, or the histories diverged) fails this job and leaves the ref untouched — nothing is ever
# force-pushed. The job summary says what to do.
#
#   jobs:
#     nzyme-mirror:
#       needs: [test]
#       if: github.event_name == 'push'
#       uses: kedrzu/nzyme/.github/workflows/consumer-mirror.yml@main
#       with:
#         consumer: healed
#       secrets:
#         nzyme-token: ${{ secrets.NZYME_TOKEN }}
#
# Runs the CLI from npm (`@nzyme/cli`); `submodule mirror` exists from the first release that
# contains it, so pin `cli-version` to that release or later if not using `latest`.

on:
  workflow_call:
    inputs:
      consumer:
        description: Consumer name — the ref prefix in nzyme, e.g. `healed` for `healed/main`.
        type: string
        required: true
      branch:
        description: The product branch being mirrored (the ref is `<consumer>/<branch>`). Defaults to the branch the caller ran on.
        type: string
        default: ''
      ref:
        description: The product commit whose pin is mirrored. Defaults to the commit the caller ran on; pass `github.event.workflow_run.head_sha` from a `workflow_run` trigger.
        type: string
        default: ''
      submodule-path:
        description: Path of the nzyme submodule in the product repository.
        type: string
        default: nzyme
      cli-version:
        description: Version (or dist-tag) of `@nzyme/cli` to run.
        type: string
        default: latest
    secrets:
      nzyme-token:
        description: Token allowed to push branches to kedrzu/nzyme (contents:write) — a fine-grained PAT.
        required: true

jobs:
  mirror:
    name: Mirror ${{ inputs.consumer }}/${{ inputs.branch || github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Two pushes to the same product branch must not race to move the same ref.
    concurrency:
      group: nzyme-mirror-${{ inputs.consumer }}-${{ inputs.branch || github.ref_name }}
      cancel-in-progress: false
    env:
      CONSUMER: ${{ inputs.consumer }}
      BRANCH: ${{ inputs.branch || github.ref_name }}
      SUBMODULE_PATH: ${{ inputs.submodule-path }}
      CLI_VERSION: ${{ inputs.cli-version }}
    steps:
      # Full history for the ancestry check (the CLI also unshallows the submodule if needed).
      # `persist-credentials: false`: otherwise checkout leaves the product's GITHUB_TOKEN as an
      # extraheader for github.com, git sends it instead of the nzyme token, and the push fails.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: true
          fetch-depth: 0
          persist-credentials: false

      # `concurrency` serialises runs but does not order them: an older push finishing after a newer
      # one would see the ref already past its pin and report a false rollback. Only the branch tip
      # is mirrored; a superseded commit is left to the run of the commit that superseded it.
      - name: Check the commit is the branch tip
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha)
          if [ "$tip" = "$(git rev-parse HEAD)" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$(git rev-parse --short HEAD) is no longer the tip of $BRANCH ($tip); not mirrored."
            echo "ℹ️ Skipped: \`$BRANCH\` has moved on to \`$tip\`, whose run mirrors it." >> "$GITHUB_STEP_SUMMARY"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2

      # Every github.com URL (the submodule's remote included) goes through the nzyme token. The
      # token stays in an env var and in the runner's throwaway global git config — never echoed.
      - name: Authenticate to nzyme
        env:
          NZYME_TOKEN: ${{ secrets.nzyme-token }}
        run: git config --global url."https://x-access-token:${NZYME_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Mirror the pinned nzyme commit
        id: mirror
        if: steps.tip.outputs.current == 'true'
        run: |
          result=$(bunx --package "@nzyme/cli@${CLI_VERSION}" nzyme submodule mirror \
            --consumer "$CONSUMER" --branch "$BRANCH" --path "$SUBMODULE_PATH")
          echo "$result"
          echo "✅ nzyme \`$result\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Explain the failure
        if: failure() && steps.mirror.outcome == 'failure'
        run: |
          {
            echo "### ❌ nzyme \`$CONSUMER/$BRANCH\` was not advanced"
            echo
            echo "The ref was left untouched. See the **Mirror the pinned nzyme commit** step log for both commits."
            echo
            echo "- **Rollback or divergence** (the product's pin does not descend from the ref): bump the product to an nzyme"
            echo "  commit that contains the ref, or — only if the ref itself must go back — move it by hand with"
            echo "  \`git push --force-with-lease\`. See _Rollback_ in nzyme's \`docs/consumers.md\`."
            echo "- **Authentication**: the \`nzyme-token\` secret must be able to push branches to kedrzu/nzyme."
          } >> "$GITHUB_STEP_SUMMARY"
