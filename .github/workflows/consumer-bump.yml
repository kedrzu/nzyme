name: Bump nzyme

# Reusable workflow for products that use nzyme as a git submodule (see docs/consumers.md).
#
# Proposes a newer nzyme to the product as a pull request: moves the submodule on `base-branch` to
# `source-ref`, commits that to `pr-branch` and opens (or refreshes) a PR whose body lists the nzyme
# commits it brings in. The product's CI on that PR is the gate — nzyme only reaches the product
# once the product's own tests pass on it. With `auto-merge`, a green PR merges itself. It writes only
# to the product.
#
# Bump `main` only: production branches get a new pin through the product's own promotion, never
# from automation (docs/consumers.md).
#
#   jobs:
#     bump:
#       uses: kedrzu/nzyme/.github/workflows/consumer-bump.yml@main
#       with:
#         cli-version: <version>
#         auto-merge: true
#         refresh-lockfile: true
#         app-client-id: ${{ vars.BUMP_APP_CLIENT_ID }}
#         environment: submodule-bump
#       secrets:
#         app-private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}
#
# The product credential is either a GitHub App (`app-client-id` + `app-private-key`, a token minted
# per run) or a `token` such as a fine-grained PAT — exactly one of them.
#
# Runs the CLI from npm (`@nzyme/cli`) at the exact `cli-version` given (`submodule bump` exists
# from the first release that contains it), in a job of its own that never has the product token.
# Steps of one job share the runner — files, `$GITHUB_ENV`, `$BASH_ENV` — so only a separate job
# keeps npm code away from a later step that holds the token. The token job runs no package code:
# it re-derives the bump with git and takes from the CLI's job only the PR description.

on:
  workflow_call:
    inputs:
      source-ref:
        description: The nzyme branch, tag or commit to bump to.
        type: string
        default: main
      base-branch:
        description: The product branch to bump.
        type: string
        default: main
      pr-branch:
        description: Branch the bump is pushed to (force-pushed on every run). Defaults to `nzyme-bump/<base-branch>`.
        type: string
        default: ''
      auto-merge:
        description: Enable auto-merge (squash) on the PR, so it merges once the product's required checks pass.
        type: boolean
        default: false
      commit-message:
        description: Commit message and PR title; `{sha}` is replaced with the new nzyme commit (abbreviated).
        type: string
        default: 'chore: bump nzyme to {sha}'
      submodule-path:
        description: Path of the nzyme submodule in the product repository.
        type: string
        default: nzyme
      refresh-lockfile:
        description: >-
          Regenerate the product's `bun.lock` for the new submodule tree and commit it with the bump,
          for products whose workspaces include the submodule's packages. Without it the bump moves
          only the gitlink and leaves the lock stale.
        type: boolean
        default: false
      cli-version:
        description: >-
          Exact version of `@nzyme/cli` to run, e.g. `1.2.3` — no dist-tag or range. It runs over a
          checkout of the product, so a moving tag would hand that to whatever gets published next.
        type: string
        required: true
      app-client-id:
        description: >-
          Client ID of a GitHub App installed on the product with contents:write and
          pull-requests:write. With `app-private-key`, the job mints a one-hour token narrowed to those
          two permissions on the product repository. Use it instead of `token`.
        type: string
        default: ''
      environment:
        description: >-
          GitHub Environment of the product for the job that holds the credential, e.g. one whose
          branch policy admits only the bumped branch, so the credential is unreadable from any other
          branch. The caller still passes the secret by name. Empty runs without an environment.
        type: string
        default: ''
    secrets:
      token:
        description: >-
          Product repository token with contents:write and pull-requests:write (a fine-grained
          PAT). Not GITHUB_TOKEN — pushes and PRs made with it do not trigger workflows, so the
          product's CI would never run on the bump, and that CI is the whole point. Set either this
          or the App credentials.
        required: false
      app-private-key:
        description: Private key of the GitHub App named by `app-client-id`.
        required: false

jobs:
  # Runs the npm CLI. No product token here (checkout uses the caller's read-only GITHUB_TOKEN, not
  # persisted); its outputs are a claim the `bump` job checks, never trusted as they are.
  prepare:
    name: Prepare the ${{ inputs.submodule-path }} bump
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
      sha: ${{ steps.bump.outputs.sha }}
      summary: ${{ steps.bump.outputs.summary }}
    env:
      SOURCE_REF: ${{ inputs.source-ref }}
      SUBMODULE_PATH: ${{ inputs.submodule-path }}
      CLI_VERSION: ${{ inputs.cli-version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.base-branch }}
          submodules: true
          fetch-depth: 0
          persist-credentials: false

      # setup-bun saves its cache in a post step, i.e. after the CLI ran — a cache the token job
      # could then restore. No cache in either job.
      - uses: oven-sh/setup-bun@v2
        with:
          no-cache: true

      # `submodule bump` prints exactly `unchanged` when the product already pins the source commit,
      # and otherwise a markdown summary (also written to bump.md) with the new gitlink staged.
      # The summary goes out base64-encoded, as a single-line job output.
      - name: Move the submodule
        id: bump
        # Explicit `bash` runs with pipefail, so a failing CLI fails the step instead of `tee`'s exit 0.
        shell: bash
        run: |
          if [[ ! "$CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::cli-version must be an exact version, got '$CLI_VERSION'" && exit 1
          fi
          bunx --package "@nzyme/cli@${CLI_VERSION}" nzyme submodule bump \
            --source "$SOURCE_REF" --path "$SUBMODULE_PATH" --summary-file "$RUNNER_TEMP/bump.md" \
            | tee "$RUNNER_TEMP/bump.out"
          if grep -qx unchanged "$RUNNER_TEMP/bump.out"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            {
              echo "changed=true"
              echo "sha=$(git -C "$SUBMODULE_PATH" rev-parse HEAD)"
              echo "summary=$(base64 -w0 "$RUNNER_TEMP/bump.md")"
            } >> "$GITHUB_OUTPUT"
          fi

  # Holds the product token and runs no package code: bun only rewrites the lockfile, with scripts
  # off. Its push triggers the product's CI.
  bump:
    name: Bump ${{ inputs.submodule-path }} on ${{ inputs.base-branch }}
    needs: prepare
    runs-on: ubuntu-latest
    # Only this job gets the environment: `prepare` runs npm code and must never see its secrets.
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    # Keyed by the submodule too: a product that bumps several submodules calls this once per path,
    # and those runs write different branches, so they need not wait for each other.
    concurrency:
      group: nzyme-bump-${{ inputs.submodule-path }}-${{ inputs.base-branch }}
      cancel-in-progress: false
    env:
      SOURCE_REF: ${{ inputs.source-ref }}
      BASE_BRANCH: ${{ inputs.base-branch }}
      PR_BRANCH: ${{ inputs.pr-branch || format('nzyme-bump/{0}', inputs.base-branch) }}
      COMMIT_MESSAGE: ${{ inputs.commit-message }}
      SUBMODULE_PATH: ${{ inputs.submodule-path }}
    steps:
      # `secrets` cannot be read in `if:`, so the check runs in the shell. Neither credential would
      # fail only at the first push; both is ambiguous about which identity writes to the product.
      - name: Check the product credential
        env:
          HAS_TOKEN: ${{ secrets.token != '' }}
          HAS_APP_ID: ${{ inputs.app-client-id != '' }}
          HAS_APP_KEY: ${{ secrets.app-private-key != '' }}
        run: |
          if [ "$HAS_APP_ID" != "$HAS_APP_KEY" ]; then
            echo "::error::app-client-id and app-private-key go together — set both or neither" && exit 1
          fi
          if [ "$HAS_TOKEN" = "$HAS_APP_ID" ]; then
            echo "::error::set exactly one product credential: the token secret, or app-client-id with app-private-key" && exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.base-branch }}
          submodules: true
          fetch-depth: 0
          persist-credentials: false

      # Re-derives the bump with git rather than trusting `prepare`: resolves `source-ref` as the
      # CLI does (fetched by name, `origin/` stripped, else a local commit such as an abbreviated
      # SHA) and goes on only when `prepare` named that same commit, so its summary describes what
      # is pushed. A source that moved between the jobs fails here too; the next run picks it up.
      # `prepare`'s values reach the shell only as env vars and are never echoed.
      - name: Check and stage the bump
        id: bump
        shell: bash
        env:
          CLAIMED_CHANGED: ${{ needs.prepare.outputs.changed }}
          CLAIMED_SHA: ${{ needs.prepare.outputs.sha }}
          SUMMARY: ${{ needs.prepare.outputs.summary }}
        run: |
          read -r mode _ previous _ < <(git ls-tree HEAD -- "$SUBMODULE_PATH") || true
          if [ "$mode" != 160000 ]; then
            echo "::error::'$SUBMODULE_PATH' is not a submodule on $BASE_BRANCH" && exit 1
          fi
          if git -C "$SUBMODULE_PATH" fetch -q origin "${SOURCE_REF#origin/}"; then
            current=$(git -C "$SUBMODULE_PATH" rev-parse 'FETCH_HEAD^{commit}')
          else
            current=$(git -C "$SUBMODULE_PATH" rev-parse --verify -q "${SOURCE_REF}^{commit}") \
              || { echo "::error::cannot resolve '$SOURCE_REF' in $SUBMODULE_PATH" && exit 1; }
          fi
          changed=false
          [ "$current" = "$previous" ] || changed=true
          if [ "$CLAIMED_CHANGED" != "$changed" ] || { [ "$changed" = true ] && [ "$CLAIMED_SHA" != "$current" ]; }; then
            echo "::error::the prepare job's result does not match '$SOURCE_REF' (now $current) — the source moved during the run, or prepare misreported" && exit 1
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [ "$changed" = true ]; then
            git -C "$SUBMODULE_PATH" -c advice.detachedHead=false checkout -q --detach "$current"
            git add -- "$SUBMODULE_PATH"
            echo "sha=${current:0:7}" >> "$GITHUB_OUTPUT"
            printf '%s' "$SUMMARY" | base64 -d > "$RUNNER_TEMP/bump.md"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.bump.outputs.changed == 'true' && inputs.refresh-lockfile
        with:
          no-cache: true

      # `bun.lock` records every workspace package's version and dependencies, and
      # `bun install --frozen-lockfile` does not notice when only a workspace version moved — so a
      # gitlink-only bump leaves a stale lock that the next developer's install rewrites inside an
      # unrelated PR. `--lockfile-only` resolves from registry metadata and installs nothing, and
      # `--ignore-scripts` runs no lifecycle script, so no package code runs in this job. Bun is the
      # product's `packageManager` version (setup-bun's default). A failing install fails the job, so
      # no PR carries a broken lock.
      - name: Refresh the lockfile
        if: steps.bump.outputs.changed == 'true' && inputs.refresh-lockfile
        run: |
          bun install --lockfile-only --ignore-scripts
          if ! git diff --quiet -- bun.lock; then
            git add bun.lock
            printf '\n%s\n' "\`bun.lock\` refreshed for the new nzyme tree." >> "$RUNNER_TEMP/bump.md"
          fi

      # Minted only after `bun` has run, so no token exists on the runner while it does. Without
      # `repositories` the token covers only the product repository (the caller), and the explicit
      # permissions keep it to those two even when the App holds more for other flows.
      - name: Mint the App token
        id: app-token
        if: inputs.app-client-id != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
          permission-pull-requests: write

      # Already at the source, e.g. bumped by hand meanwhile: a PR left open from an earlier run
      # would only roll the product back.
      - name: Close a stale bump PR
        if: steps.bump.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.token }}
        run: |
          echo "ℹ️ \`$BASE_BRANCH\` already pins nzyme \`$SOURCE_REF\`." >> "$GITHUB_STEP_SUMMARY"
          for pr in $(gh pr list --base "$BASE_BRANCH" --head "$PR_BRANCH" --state open --json number --jq '.[].number'); do
            gh pr close "$pr" --comment "\`$BASE_BRANCH\` already pins nzyme \`$SOURCE_REF\`." --delete-branch
          done

      - name: Open or update the bump PR
        if: steps.bump.outputs.changed == 'true'
        env:
          SHA: ${{ steps.bump.outputs.sha }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          message="${COMMIT_MESSAGE//\{sha\}/$SHA}"
          if [ -n "$APP_SLUG" ]; then
            user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
            git config user.name "${APP_SLUG}[bot]"
            git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          git switch -C "$PR_BRANCH"
          git commit --no-verify -qm "$message"
          # A bot-owned branch, regenerated from the base on every run — force is expected here.
          gh auth setup-git
          git push --no-verify --force origin "HEAD:refs/heads/$PR_BRANCH"

          {
            cat "$RUNNER_TEMP/bump.md"
            echo
            echo "---"
            echo "Opened by nzyme's \`consumer-bump\` workflow and regenerated on every run — do not push to \`$PR_BRANCH\`."
          } > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/bump.md" >> "$GITHUB_STEP_SUMMARY"

          pr=$(gh pr list --base "$BASE_BRANCH" --head "$PR_BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$message" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base "$BASE_BRANCH" --head "$PR_BRANCH" --title "$message" --body-file "$RUNNER_TEMP/body.md"
          fi

      # Needs "Allow auto-merge" and required status checks on the base branch — without required
      # checks GitHub merges the PR right away, before the product's CI ran.
      - name: Enable auto-merge
        if: steps.bump.outputs.changed == 'true' && inputs.auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.token }}
        run: gh pr merge "$PR_BRANCH" --auto --squash
