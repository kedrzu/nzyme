name: Forward-port a consumer release into main

# A hotfix for one product's production lands on nzyme's `<consumer>/release` (see
# docs/consumers.md). This opens a PR `<consumer>/release → main`, so the fix also reaches main —
# and so the next fast-forward of `<consumer>/release` from main stays possible: that needs every
# commit on `<consumer>/release` to be an ancestor of main.
#
# Hence the PR must be merged with a merge commit. A squash merge would put a copy of the hotfix on
# main, not the hotfix commit itself, and `<consumer>/release` would stay diverged from main.
#
# The PR's head is `<consumer>/release` itself, so later hotfixes join the open PR automatically.
# Pull requests opened with the workflow token do not trigger other workflows (CI, the PR-title
# check) — RELEASE_BOT_TOKEN is preferred for that reason, as in back-merge.yml.

on:
  push:
    branches: ['*/release']

concurrency:
  group: forward-port-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  forward-port:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
      RELEASE_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - run: |
          git fetch origin main
          ahead=$(git rev-list --count origin/main..HEAD)
          if [ "$ahead" -eq 0 ]; then
            echo "main already contains $RELEASE_BRANCH."
            exit 0
          fi

          if [ -n "$(gh pr list --base main --head "$RELEASE_BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "A forward-port PR for $RELEASE_BRANCH is already open; it now carries the new commits."
            exit 0
          fi

          cat > "$RUNNER_TEMP/body.md" <<EOF
          \`$RELEASE_BRANCH\` has $ahead commit(s) that are not in \`main\` — a hotfix for that product's production.

          **Merge this PR with a merge commit — not a squash, not a rebase.** \`$RELEASE_BRANCH\` only ever
          fast-forwards, and its next fast-forward from main needs the hotfix commits themselves to be
          ancestors of main. A squash or rebase would land copies, leaving \`$RELEASE_BRANCH\` diverged.

          **Do not delete \`$RELEASE_BRANCH\`** after merging.

          If this conflicts, do not merge main into \`$RELEASE_BRANCH\`: resolve on a branch cut from main
          (\`git switch -c forward-port/<name> origin/main && git merge origin/$RELEASE_BRANCH\`), open a PR
          from it into main and merge that with a merge commit.
          EOF

          gh pr create --base main --head "$RELEASE_BRANCH" \
            --title "chore: forward-port $RELEASE_BRANCH into main" --body-file "$RUNNER_TEMP/body.md"
