name: Promote main to release

# Starts a release: merges main into `release`, then runs the release workflow, which opens the
# release PR with the next version and changelog. Pushes made with the workflow token do not trigger
# other workflows, hence the explicit call.

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  promote:
    name: Merge main into release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release
          fetch-depth: 0
          token: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor HEAD origin/main; then
            git merge --ff-only origin/main
          else
            git merge --no-ff origin/main -m "chore: promote main to release"
          fi
          git push origin HEAD:release

  release:
    needs: promote
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    secrets: inherit
